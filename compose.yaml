services:
  atlas:
    build: .
    ports:
      - "127.0.0.1:8740:8740"
    environment:
      ATLAS_DATA_DIR: /app/runtime
      ATLAS_ADMIN_TOKEN: ${ATLAS_ADMIN_TOKEN:-}
    volumes:
      - atlas-data:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  atlas-data:
