<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="18" fill="#f3f7f3"/><g font-family="Segoe UI,Arial,sans-serif" fill="#153630"><text x="42" y="48" font-size="24" font-weight="700">Study Atlas · a traceable path from experiment to release</text><text x="42" y="75" font-size="13" fill="#687a7b">Synthetic public lifecycle extension. Historical collaborative research and fitted artifacts remain separate.</text><g stroke="#c9ddd1" fill="white"><rect x="40" y="110" width="205" height="110" rx="12"/><rect x="275" y="110" width="205" height="110" rx="12"/><rect x="510" y="110" width="205" height="110" rx="12"/><rect x="745" y="110" width="205" height="110" rx="12"/><rect x="980" y="110" width="180" height="110" rx="12"/><rect x="275" y="285" width="290" height="110" rx="12"/><rect x="600" y="285" width="290" height="110" rx="12"/><rect x="925" y="285" width="235" height="110" rx="12"/></g><g font-size="15" font-weight="650"><text x="58" y="145">1. Train cities</text><text x="292" y="145">2. Calibrate cities</text><text x="527" y="145">3. Validate cities</text><text x="762" y="145">4. Release registry</text><text x="997" y="145">5. Serve</text><text x="292" y="319">Sealed final test</text><text x="617" y="319">Monitoring and diagnostics</text><text x="942" y="319">Study Atlas dashboard</text></g><g font-size="12" fill="#687a7b"><text x="58" y="172">18 cities · grouped CV</text><text x="58" y="193">Fold-only impute + scale</text><text x="292" y="172">4 cities · frozen base model</text><text x="292" y="193">Fit sigmoid on this set only</text><text x="527" y="172">4 cities · threshold + gates</text><text x="527" y="193">No final-test optimization</text><text x="762" y="172">Data / code / model hashes</text><text x="762" y="193">Atomic promote / rollback</text><text x="997" y="172">FastAPI · validated batch</text><text x="997" y="193">Exact release provenance</text><text x="292" y="346">4 cities · evaluate after release is chosen</text><text x="292" y="368">One report per held-out partition fingerprint</text><text x="617" y="346">Training-bin PSI / missingness alerts</text><text x="617" y="368">HTTP latency, calibration, audit trail</text><text x="942" y="346">Read only by default</text><text x="942" y="368">Admin operations need a token</text></g><g fill="none" stroke="#087f73" stroke-width="2"><path d="M245 165h30m205 0h30m205 0h30m205 0h30"/><path d="M845 220v32H420v33"/><path d="M1070 220v32H745v33"/><path d="M1070 252v33"/></g><text x="42" y="440" font-size="12" fill="#687a7b">No research data uploads · No arbitrary model deserialization · No external API credentials required · One service and a persistent local volume</text></g></svg>
